<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Remote File Explorer</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">
  <div class="bg-slate-950 border border-slate-800 rounded-xl max-w-sm w-full p-6 shadow-2xl">
    <div class="text-center mb-6">
      <div class="w-12 h-12 bg-indigo-600/20 text-indigo-400 rounded-xl flex items-center justify-center mx-auto mb-3 border border-indigo-500/30">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
      </div>
      <h2 class="text-lg font-bold text-white">Authentication Required</h2>
      <p class="text-xs text-slate-400 mt-1">Enter your shared AUTH_TOKEN to access files</p>
    </div>

    {% if error %}
      <div class="mb-4 p-2.5 bg-rose-500/10 border border-rose-500/30 text-rose-400 text-xs rounded-lg text-center">
        {{ error }}
      </div>
    {% endif %}

    <form method="POST" action="/login" class="space-y-4">
      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1">Secret Token</label>
        <input type="password" name="token" required autofocus placeholder="Enter AUTH_TOKEN..." 
               class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500">
      </div>
      <button type="submit" class="w-full py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold rounded-lg shadow transition">
        Authenticate &amp; Open
      </button>
    </form>
  </div>
</body>
</html>
